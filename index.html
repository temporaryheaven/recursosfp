<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo e Índice de Recursos Online para Formadores - Formación Profesional y Educación de Adultos.">
  <title>Recursos para Formadores | SPA Option 1</title>
  
  <!-- Favicon, Fonts & Stylesheet -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=5.0">
</head>
<body>

  <!-- Top Navbar Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-icon">🎓</div>
      <div class="brand-text">
        <h1 id="appTitle">Recursos para Formadores</h1>
        <p id="appSubtitle">Formación Profesional y Educación de Adultos</p>
      </div>
    </div>

    <div class="header-controls">
      <!-- Slide Counter Badge -->
      <div id="slideCounter" class="slide-badge">
        <span class="dot"></span> 1 / 14
      </div>

      <!-- View Mode Switcher -->
      <div class="mode-switcher">
        <button id="btnViewSlides" class="toggle-btn active">
          <span>📊</span> <span id="txtViewSlides">Diapositivas</span>
        </button>
        <button id="btnViewExplorer" class="toggle-btn">
          <span>🗂️</span> <span id="txtViewExplorer">Explorador (78)</span>
        </button>
      </div>

      <!-- Propose Resource Button -->
      <button id="btnOpenPropose" class="lang-btn propose-btn" onclick="openProposeModal()" title="Proponer Recurso">
        ➕ <span id="txtProposeBtn">Proponer Recurso</span>
      </button>

      <!-- Slide Drawer Toggle -->
      <button id="btnOpenDrawer" class="icon-btn" title="Índice de Diapositivas">
        ☰
      </button>

      <!-- Theme Switcher -->
      <button id="btnThemeToggle" class="lang-btn theme-btn" title="Cambiar Tema / Switch Theme">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Oscuro</span>
      </button>

      <!-- Language Switcher -->
      <button id="btnLangToggle" class="lang-btn" title="Cambiar Idioma / Switch Language">
        <span id="langLabel">ES</span> 🌐
      </button>
    </div>
  </header>

  <!-- Main App Layout Container -->
  <main class="main-container">
    
    <!-- 1. Slide View Mode -->
    <div id="slideViewport" class="slide-viewport">
      <!-- Dynamic Slide Contents Rendered by app.js -->
    </div>

    <!-- Bottom Navigation Bar (Slide Mode) -->
    <div id="bottomNav" class="bottom-nav">
      <button id="btnPrev" class="nav-btn">← Anterior</button>
      <div id="paginationDots" class="pagination-dots">
        <!-- 14 Interactive Dots Rendered by app.js -->
      </div>
      <button id="btnNext" class="nav-btn btn-next">Siguiente →</button>
    </div>

    <!-- 2. Explorer View Mode -->
    <div id="explorerView" class="explorer-view">
      <div class="explorer-toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar herramienta, categoría o palabra clave...">
        </div>

        <div class="filter-group">
          <select id="filterCategory" class="select-filter">
            <option value="ALL">Todas las categorías</option>
          </select>

          <select id="filterDifficulty" class="select-filter">
            <option value="ALL">Todas las dificultades</option>
          </select>
        </div>
      </div>

      <div id="explorerGrid" class="explorer-grid">
        <!-- 77 Resource Cards Rendered by app.js -->
      </div>
    </div>

  </main>

  <!-- Slide Index Drawer Modal Overlay -->
  <div id="drawerBackdrop" class="drawer-backdrop">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3><span id="drawerTitleText">Índice de Diapositivas</span></h3>
        <button id="btnCloseDrawer" class="btn-close-drawer">✕</button>
      </div>
      <div id="drawerList" class="drawer-list">
        <!-- 14 Drawer List Items Rendered by app.js -->
      </div>
    </div>
  </div>

  <!-- Propose Resource Modal Overlay -->
  <div id="proposeBackdrop" class="drawer-backdrop">
    <div class="modal-panel">
      <div class="drawer-header">
        <h3><span id="modalProposeTitle">Proponer Nuevo Recurso</span></h3>
        <button id="btnClosePropose" class="btn-close-drawer" onclick="closeProposeModal()">✕</button>
      </div>
      <form id="proposeForm" class="propose-form">
        <p id="modalProposeSubtitle" class="form-desc">
          Propón una herramienta digital para incluirla en el compendio. Será revisada por un administrador antes de publicarse.
        </p>

        <div class="form-group">
          <label for="propName" id="lblPropName">Nombre de la Herramienta *</label>
          <input type="text" id="propName" required class="search-input">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="propCategory" id="lblPropCategory">Categoría *</label>
            <select id="propCategory" required class="select-filter">
              <!-- Rendered by app.js -->
            </select>
          </div>

          <div class="form-group">
            <label for="propDifficulty" id="lblPropDifficulty">Dificultad *</label>
            <select id="propDifficulty" required class="select-filter">
              <option value="Fácil">Fácil / Easy</option>
              <option value="Media">Media / Medium</option>
              <option value="Difícil">Difícil / Difficult</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="propUrl" id="lblPropUrl">Sitio Web (URL) *</label>
          <input type="url" id="propUrl" required class="search-input">
        </div>

        <div class="form-group">
          <label for="propDescription" id="lblPropDescription">Descripción Corta *</label>
          <textarea id="propDescription" rows="2" required class="search-input form-textarea"></textarea>
        </div>

        <div class="form-group">
          <label for="propExample" id="lblPropExample">Ejemplo de Uso Educativo *</label>
          <textarea id="propExample" rows="2" required class="search-input form-textarea"></textarea>
        </div>

        <div class="form-group">
          <label for="propEmail" id="lblPropEmail">Tu Correo Electrónico (Opcional)</label>
          <input type="email" id="propEmail" class="search-input">
        </div>

        <div id="proposeStatus" class="form-status-msg"></div>

        <div class="form-actions">
          <button type="button" id="btnCancelPropose" class="toggle-btn" onclick="closeProposeModal()">Cancelar</button>
          <button type="submit" id="btnSubmitPropose" class="toggle-btn active submit-btn">
            <span>🚀</span> <span id="txtSubmitBtn">Enviar Propuesta</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="./embedded_data.js?v=5.0"></script>
  <script src="./app.js?v=5.0"></script>
</body>
</html>
